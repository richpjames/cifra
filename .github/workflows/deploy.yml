# A merged PR lands on main as a push; this pings Coolify's deploy webhook,
# and Coolify pulls the repo and rebuilds the Dockerfile itself.
# Secrets (repo → Settings → Secrets and variables → Actions):
#   COOLIFY_WEBHOOK_URL — your app's deploy URL, e.g.
#     https://<coolify-host>/api/v1/deploy?uuid=<app-uuid>
#   COOLIFY_TOKEN       — optional team API token; sent as Bearer if set
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "redeploy" button

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Missing COOLIFY_WEBHOOK_URL secret — Coolify → your app → Webhooks." >&2
            exit 1
          fi
          # Angle brackets / quotes / whitespace: the placeholder wasn't
          # substituted (curl would only fail with a cryptic DNS error).
          case "$WEBHOOK_URL" in
            *"<"*|*">"*|*[[:space:]]*|*"'"*|*'"'*)
              echo "::error::COOLIFY_WEBHOOK_URL contains placeholder characters — paste the real URL, e.g. https://coolify.example.com/api/v1/deploy?uuid=1234-abcd" >&2
              exit 1
              ;;
          esac
          # /api/v1/deploy is POST-only; a GET there returns 405.
          if [ -n "$API_TOKEN" ]; then
            curl --fail --silent --show-error --max-time 30 --request POST \
              --header "Authorization: Bearer $API_TOKEN" "$WEBHOOK_URL"
          else
            curl --fail --silent --show-error --max-time 30 --request POST "$WEBHOOK_URL"
          fi
